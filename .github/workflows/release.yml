# Signed builds. Runs only on a tag pushed to this repository, never on a pull
# request — fork PRs must never see these secrets.
name: release

on:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
      - name: Assemble release
        working-directory: android
        env:
          SLOPCODER_STORE_FILE: release.keystore
          SLOPCODER_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SLOPCODER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SLOPCODER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - run: npm ci
      - uses: ruby/setup-ruby@v1
        # Version comes from .ruby-version. The Gemfile works on 3.4 too, but
        # pinning means a runner image bump cannot change the CocoaPods that
        # generates the Xcode project.
        with:
          bundler-cache: true
      - name: Install pods
        # The Gemfile is at the repo root, not in ios/ — only pod install runs there.
        run: bundle exec pod install --project-directory=ios
      - name: Import the signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # A throwaway keychain, so nothing outlives the job.
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          # codesign searches the keychain *list*, which create-keychain does not
          # join. Without this the identity is present and still "not found".
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p runner build.keychain
          # An archive outlasts the default five-minute lock, and the failure
          # reads as a signing error rather than as a timeout.
          security set-keychain-settings -lut 3600 build.keychain
          echo "$CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k runner build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > profile.mobileprovision
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          # The profile carries its own name and the team it belongs to. Reading
          # them out of it beats two more secrets that can drift from the portal
          # — and a team id is a lookup nobody should have to go hunting for.
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist)
          echo "SLOPCODER_PROFILE=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "SLOPCODER_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "profile: $PROFILE_NAME, team: $TEAM_ID"
      - name: Archive and export
        working-directory: ios
        run: |
          # The tag is the version; the run number is the build. App Store Connect
          # rejects a build number it has already seen, so it must never be the
          # literal 1 that sits in the project file.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version $VERSION build $GITHUB_RUN_NUMBER"

          # Generated rather than committed: every value in it comes from a
          # secret or from the profile, so a checked-in copy would be a file that
          # is wrong by definition.
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$SLOPCODER_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>codes.sand.slopcoder</key><string>$SLOPCODER_PROFILE</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -workspace slopcoder_mobile.xcworkspace \
            -scheme slopcoder_mobile -configuration Release \
            -archivePath build/slopcoder.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            SLOPCODER_TEAM_ID="$SLOPCODER_TEAM_ID" \
            SLOPCODER_PROFILE="$SLOPCODER_PROFILE" \
            archive
          xcodebuild -exportArchive -archivePath build/slopcoder.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa
      - name: Upload to TestFlight
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_BASE64: ${{ secrets.APP_STORE_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_KEY_BASE64" | base64 -d > ~/private_keys/AuthKey_$APP_STORE_KEY_ID.p8
          xcrun altool --upload-app -f ios/build/ipa/*.ipa -t ios \
            --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID"
