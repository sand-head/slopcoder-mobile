# A release build, cut by hand from the Actions tab — never on a pull request.
#
# There is no version to choose. App Store Connect enforces uniqueness on the
# build number and nothing else, and the build number is the run number, which
# can never repeat; the version is the date the build was cut, so TestFlight
# reads "2026.09.13 (35)" and says something true without anyone having decided
# it. Which commit it is comes from the run.
#
# What this does today: builds the app in release configuration on Linux, with
# the version, build number, push relay and production APNs environment stamped
# in, and keeps the unsigned .ipa as the run's artifact.
#
# What it does not do yet: sign that .ipa for distribution and send it to
# TestFlight. The React Native build did both with Xcode on a Mac runner. xtool
# signs for development only (a registered device, via `xtool auth` and
# `xtool dev run`) and has no upload. docs/testflight.md says what is needed to
# close that gap from Linux, and what is still unproven about it.
name: release

on:
  workflow_dispatch:

jobs:
  # A macOS runner lends its Xcode's SDK to the Linux job below.
  sdk:
    uses: ./.github/workflows/xcode-sdk.yml

  ios:
    needs: sdk
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl zstd xz-utils zip unzip python3
          scripts/install-xtool.sh
      # A release must not ship something the tests would have caught.
      - name: Test
        run: swift test
      - name: Restore the parts of Xcode
        uses: actions/cache/restore@v4
        with:
          path: xcode
          key: ${{ needs.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Install the iOS SDK
        run: |
          xtool sdk install --slim xcode/Xcode.app
          xtool sdk status
          rm -rf xcode
      - name: Stamp the version
        env:
          # Where the app turns its APNs token into a Web Push endpoint: the
          # slopcoder deployment that holds this app's Apple key. A variable
          # rather than a secret — it is a public URL — and rather than a value
          # in the repository, because it is the publisher's address and not a
          # property of the code. Empty builds an app with notifications off.
          SLOPCODER_PUSH_RELAY: ${{ vars.SLOPCODER_PUSH_RELAY }}
        run: |
          # The date is the version; the run number is the build. Two builds on
          # one day differ by their build number, which is what it is for.
          python3 scripts/stamp.py \
            --version "$(date -u +%Y.%m.%d)" \
            --build "$GITHUB_RUN_NUMBER" \
            --relay "$SLOPCODER_PUSH_RELAY" \
            --aps production
      - name: Build the app
        run: xtool dev build --configuration release --ipa
      # A run, not a tag: there is no release to hang this off, so it is the
      # run's own artifact and expires with it.
      - name: Keep the unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: slopcoder-${{ github.run_number }}-unsigned
          path: xtool/*.ipa
