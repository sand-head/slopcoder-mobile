# Checks on main. Development happens on Forgejo, which mirrors main here, so
# in practice this runs once a change has merged — not on the branch it was
# written on. `pull_request` stays for a pull request opened on GitHub itself,
# and `workflow_dispatch` lets a run be started by hand. Nothing here needs a
# secret or a variable.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The part of the app that is not UI — the wire client, the live stream, the
  # transcript, every rule about what a screen says — is plain Swift with no
  # Apple framework in it. It builds and is tested on Linux with no SDK.
  test:
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
      # On Linux the SwiftUI sources are inside `#if canImport(UIKit)`: this
      # parses them but type-checks none of it. The `ios` job compiles them.
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  # A macOS runner lends its Xcode's SDK to the Linux job below.
  sdk:
    uses: ./.github/workflows/xcode-sdk.yml

  # The app itself, compiled against Apple's SDK and packaged by xtool — on Linux.
  ios:
    needs: sdk
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl zstd xz-utils zip unzip python3
          scripts/install-xtool.sh
      - name: Restore the parts of Xcode
        uses: actions/cache/restore@v4
        with:
          path: xcode
          key: ${{ needs.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Install the iOS SDK
        run: |
          xtool sdk install --slim xcode/Xcode.app
          xtool sdk status
          rm -rf xcode
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-ios-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: swiftpm-ios-${{ hashFiles('Package.swift') }}-
      # Unsigned: this proves the app and its notification extension compile,
      # link and package. It needs no Apple account.
      - name: Build the app
        run: xtool dev build --ipa
      - name: Keep the unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: slopcoder-unsigned-${{ github.sha }}
          path: xtool/*.ipa
          retention-days: 7
      # The same sources for the simulator, which the next job launches.
      - name: Build for the simulator
        run: |
          xtool dev build --triple arm64-apple-ios17.0-simulator
          tar -czf slopcoder-simulator.tar.gz -C xtool Slopcoder.app
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: slopcoder-simulator.tar.gz
          retention-days: 3

  # Compiling is not running. This opens the Linux-built app on a simulated
  # iPhone and, where the runner has one, a simulated iPhone Duo; fails if it
  # does not stay up on either; and keeps a screenshot of what each showed —
  # the sign-in screen, since nothing here has an account.
  simulator:
    # Only when a run is started by hand. It takes about a quarter of an hour,
    # most of it waiting on simulators, and the `ui-tests` job already shows on
    # every push that the app launches and works. What this adds is the app as
    # xtool built it, and a look at both displays of an iPhone Duo.
    if: github.event_name == 'workflow_dispatch'
    needs: ios
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simulator-app
      - name: Launch it on simulated iPhones
        run: |
          tar -xzf slopcoder-simulator.tar.gz
          # The simulator wants a signature, but any will do.
          codesign --force --deep --sign - Slopcoder.app

          # The newest available device whose name matches: "duo" for an iPhone
          # Duo, "plain" for any other iPhone.
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json, sys
          want = sys.argv[1]
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in devices[runtime]:
                  name = device['name']
                  if name.startswith('iPhone') and (('Duo' in name) == (want == 'duo')):
                      print(device['udid'])
                      sys.exit()
          " "$1"
          }

          # simctl is not always steady on a hosted runner: the simulator
          # service can abort with an assertion of its own, or die under a
          # device mid-boot. One more try covers the first; the second is
          # handled below by starting the device over.
          sim() {
            if xcrun simctl "$@"; then return 0; fi
            echo "simctl $1 failed; one more try"
            sleep 10
            xcrun simctl "$@"
          }

          # An iPhone Duo has two displays, and simctl will not guess between
          # them: it fails and lists them as --display=N. Take one picture per
          # display it names, so both the outer and the inner screen are kept.
          shoot() {
            local label="$1" udid="$2" display displays
            if xcrun simctl io "$udid" screenshot "screenshot-$label.png" 2> shoot.err; then
              return 0
            fi
            cat shoot.err
            displays=$(grep -o -- '--display=[0-9A-Za-z]*' shoot.err | sort -u)
            [ -n "$displays" ] || return 1
            for display in $displays; do
              xcrun simctl io "$udid" screenshot "$display" "screenshot-$label-display${display#--display=}.png" || return 1
            done
          }

          # One go at a device. Answers 0 when the app launched and stayed up,
          # 1 when it launched and died — which is the app's fault and the
          # thing this job exists to catch — and 2 when the simulator let us
          # down before that could be found out.
          attempt() {
            local label="$1" udid="$2" launched pid
            # Boots the device if it is not booted, and waits until it is.
            sim bootstatus "$udid" -b || return 2
            sim install "$udid" Slopcoder.app || return 2
            # Prints "codes.sand.slopcoder: <pid>"; the pid is a process on this Mac.
            launched=$(sim launch "$udid" codes.sand.slopcoder | tail -1) || return 2
            pid="${launched##* }"
            case "$pid" in
              ''|*[!0-9]*) echo "launch did not give a pid: $launched"; return 2 ;;
            esac
            echo "launched as $pid"
            sleep 15
            # A picture is worth having, not worth failing for.
            shoot "$label" "$udid" || echo "::warning::No screenshot on $label."
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::The app exited within 15 seconds of launch on $label."
              xcrun simctl spawn "$udid" log show --last 1m --predicate 'process == "Slopcoder"' | tail -100 || true
              return 1
            fi
            return 0
          }

          # Up to three goes, starting the device over between them. `required`
          # says what to do if the simulator never cooperates: fail, or say so
          # and move on.
          smoke() {
            local label="$1" udid="$2" required="$3" try result
            echo "::group::$label ($udid)"
            for try in 1 2 3; do
              result=0
              attempt "$label" "$udid" || result=$?
              xcrun simctl shutdown "$udid" > /dev/null 2>&1 || true
              if [ "$result" -eq 0 ]; then
                echo "::endgroup::"
                return 0
              fi
              if [ "$result" -eq 1 ]; then
                echo "::endgroup::"
                exit 1
              fi
              echo "The simulator gave out on $label (go $try of 3); starting it over."
              sleep 10
            done
            echo "::endgroup::"
            if [ "$required" = required ]; then
              echo "::error::The $label simulator never got as far as running the app."
              exit 1
            fi
            echo "::warning::The $label simulator never got as far as running the app; nothing was learned about the app there."
          }

          smoke iphone "$(pick plain)" required
          duo="$(pick duo)"
          if [ -n "$duo" ]; then
            # The Duo simulator is the less steady of the two on a hosted
            # runner. If it will not run, that is a warning, not a failure:
            # the plain iPhone has already shown whether the app starts.
            smoke duo "$duo" optional
          else
            echo "::warning::No iPhone Duo simulator on this runner; only the plain iPhone was tried."
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshot-*.png
          retention-days: 14

  # The release is the one build made by Xcode rather than xtool (see
  # release.yml). This builds that project unsigned, so a change that breaks it
  # is found when it reaches main and not on the day of a release.
  xcode:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Generate the Xcode project
        run: |
          python3 scripts/xcode-plists.py
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build, unsigned
        run: |
          xcodebuild -project Slopcoder.xcodeproj \
            -scheme SlopcoderApp -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            build

  # The app walked by a person, as near as CI gets: XCUITests (App/UITests)
  # launch a debug build with -SlopcoderStub 1, which signs in from memory and
  # talks to a canned server in process (Sources/SlopcoderCore/Stub), and go
  # from the session list into a session, send a message, open the session's
  # panel and open a settings page. Every step keeps a screenshot, pass or
  # fail; they are extracted below as plain PNGs.
  #
  # A simulator that never boots is not a failure of the app, and the owner
  # should not be woken by one; but a job that cannot fail tells nobody
  # anything. So the line is drawn at the boot, which is checked on its own
  # before any test runs, with three goes and the device started over between
  # them. A device that never boots is a warning and a note in the run's
  # summary. Once one has booted, anything that goes wrong — a build that
  # fails, an app that will not launch, a test that fails three times running
  # — fails the job. A flaky test gets three goes (-retry-tests-on-failure);
  # a broken one fails all three.
  ui-tests:
    runs-on: xcode-27
    # About ten minutes when healthy. Past twenty the simulator is stuck, and a
    # stuck simulator should cost twenty minutes, not an hour.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Generate the Xcode project
        run: |
          python3 scripts/xcode-plists.py
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Boot a simulated iPhone
        id: boot
        run: |
          # The newest available iPhone that is not an iPhone Duo. The Duo's
          # simulator is not used here: on a hosted runner the same four tests
          # ran for over forty minutes on it without finishing.
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in devices[runtime]:
                  name = device['name']
                  if name.startswith('iPhone') and 'Duo' not in name:
                      print(device['udid'])
                      sys.exit()
          "
          }

          # Boots the device and waits until it is up; three goes, starting it
          # over between them. Answers 0 once it is up.
          boot() {
            local udid="$1" try
            for try in 1 2 3; do
              if xcrun simctl bootstatus "$udid" -b; then return 0; fi
              echo "The simulator did not boot (go $try of 3); starting it over."
              xcrun simctl shutdown "$udid" > /dev/null 2>&1 || true
              sleep 10
            done
            return 1
          }

          iphone="$(pick)"
          if [ -z "$iphone" ]; then
            echo "::warning::No iPhone simulator on this runner; the UI tests did not run."
            echo "The UI tests did not run: no iPhone simulator on this runner." >> "$GITHUB_STEP_SUMMARY"
            echo "iphone=" >> "$GITHUB_OUTPUT"
          elif boot "$iphone"; then
            echo "iphone=$iphone" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The iPhone simulator never booted; the UI tests did not run, and nothing was learned about the app."
            echo "The UI tests did not run: the iPhone simulator never booted (three goes)." >> "$GITHUB_STEP_SUMMARY"
            echo "iphone=" >> "$GITHUB_OUTPUT"
          fi
      # Signed ad hoc, as the simulator wants and as needs no Apple account.
      # Debug, because only a debug build has the stub mode the tests use.
      - name: UI tests on the iPhone
        if: steps.boot.outputs.iphone != ''
        run: |
          xcodebuild test \
            -project Slopcoder.xcodeproj \
            -scheme SlopcoderUITests -configuration Debug \
            -destination "id=${{ steps.boot.outputs.iphone }}" \
            -resultBundlePath build/ui-iphone.xcresult \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
      # The screenshots, out of the result bundles and under the names the
      # tests gave them. Best effort: a missing picture is not a failure.
      - name: Extract the screenshots
        if: always()
        run: |
          mkdir -p screenshots
          for bundle in build/ui-*.xcresult; do
            [ -d "$bundle" ] || continue
            device="$(basename "$bundle" .xcresult)"
            out="exported-$device"
            rm -rf "$out"
            if ! xcrun xcresulttool export attachments --path "$bundle" --output-path "$out"; then
              echo "::warning::Could not export the attachments of $bundle."
              continue
            fi
            # The files are exported under generated names; manifest.json says
            # which is which.
            python3 - "$out" "$device" <<'PY'
          import json, pathlib, re, shutil, sys
          out, device = pathlib.Path(sys.argv[1]), sys.argv[2]
          for test in json.loads((out / "manifest.json").read_text()):
              for attachment in test.get("attachments", []):
                  source = out / attachment["exportedFileName"]
                  name = attachment.get("suggestedHumanReadableName") or source.stem
                  name = re.sub(r"[^A-Za-z0-9 ._-]", "", name).strip() or source.stem
                  target = pathlib.Path("screenshots") / f"{device} - {name}{source.suffix or '.png'}"
                  shutil.copyfile(source, target)
                  print(target)
          PY
          done
          ls screenshots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: build/ui-*.xcresult
          if-no-files-found: ignore
          retention-days: 14
