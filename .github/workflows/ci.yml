# Checks on main. Development happens on Forgejo, which mirrors main here, so
# in practice this runs once a change has merged — not on the branch it was
# written on. `pull_request` stays for a pull request opened on GitHub itself,
# and `workflow_dispatch` lets a run be started by hand. Nothing here needs a
# secret or a variable.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The part of the app that is not UI — the wire client, the live stream, the
  # transcript, every rule about what a screen says — is plain Swift with no
  # Apple framework in it. It builds and is tested on Linux with no SDK.
  test:
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
      # On Linux the SwiftUI sources are inside `#if canImport(UIKit)`: this
      # parses them but type-checks none of it. The `ios` job compiles them.
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  # A macOS runner lends its Xcode's SDK to the Linux job below.
  sdk:
    uses: ./.github/workflows/xcode-sdk.yml

  # The app itself, compiled against Apple's SDK and packaged by xtool — on Linux.
  ios:
    needs: sdk
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl zstd xz-utils zip unzip python3
          scripts/install-xtool.sh
      - name: Restore the parts of Xcode
        uses: actions/cache/restore@v4
        with:
          path: xcode
          key: ${{ needs.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Install the iOS SDK
        run: |
          xtool sdk install --slim xcode/Xcode.app
          xtool sdk status
          rm -rf xcode
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-ios-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: swiftpm-ios-${{ hashFiles('Package.swift') }}-
      # Unsigned: this proves the app and its notification extension compile,
      # link and package. It needs no Apple account.
      - name: Build the app
        run: xtool dev build --ipa
      - name: Keep the unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: slopcoder-unsigned-${{ github.sha }}
          path: xtool/*.ipa
          retention-days: 7
      # The same sources for the simulator, which the next job launches.
      - name: Build for the simulator
        run: |
          xtool dev build --triple arm64-apple-ios17.0-simulator
          tar -czf slopcoder-simulator.tar.gz -C xtool Slopcoder.app
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: slopcoder-simulator.tar.gz
          retention-days: 3

  # Compiling is not running. This opens the Linux-built app on a simulated
  # iPhone and, where the runner has one, a simulated iPhone Duo; fails if it
  # does not stay up on either; and keeps a screenshot of what each showed —
  # the sign-in screen, since nothing here has an account.
  simulator:
    needs: ios
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simulator-app
      - name: Launch it on simulated iPhones
        run: |
          tar -xzf slopcoder-simulator.tar.gz
          # The simulator wants a signature, but any will do.
          codesign --force --deep --sign - Slopcoder.app

          # The newest available device whose name matches: "duo" for an iPhone
          # Duo, "plain" for any other iPhone.
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json, sys
          want = sys.argv[1]
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in devices[runtime]:
                  name = device['name']
                  if name.startswith('iPhone') and (('Duo' in name) == (want == 'duo')):
                      print(device['udid'])
                      sys.exit()
          " "$1"
          }

          # simctl is not always steady on a hosted runner: the simulator
          # service can abort with an assertion of its own, or die under a
          # device mid-boot. One more try covers the first; the second is
          # handled below by starting the device over.
          sim() {
            if xcrun simctl "$@"; then return 0; fi
            echo "simctl $1 failed; one more try"
            sleep 10
            xcrun simctl "$@"
          }

          # An iPhone Duo has two displays, and simctl will not guess between
          # them: it fails and lists them as --display=N. Take one picture per
          # display it names, so both the outer and the inner screen are kept.
          shoot() {
            local label="$1" udid="$2" display displays
            if xcrun simctl io "$udid" screenshot "screenshot-$label.png" 2> shoot.err; then
              return 0
            fi
            cat shoot.err
            displays=$(grep -o -- '--display=[0-9A-Za-z]*' shoot.err | sort -u)
            [ -n "$displays" ] || return 1
            for display in $displays; do
              xcrun simctl io "$udid" screenshot "$display" "screenshot-$label-display${display#--display=}.png" || return 1
            done
          }

          # One go at a device. Answers 0 when the app launched and stayed up,
          # 1 when it launched and died — which is the app's fault and the
          # thing this job exists to catch — and 2 when the simulator let us
          # down before that could be found out.
          attempt() {
            local label="$1" udid="$2" launched pid
            # Boots the device if it is not booted, and waits until it is.
            sim bootstatus "$udid" -b || return 2
            sim install "$udid" Slopcoder.app || return 2
            # Prints "codes.sand.slopcoder: <pid>"; the pid is a process on this Mac.
            launched=$(sim launch "$udid" codes.sand.slopcoder | tail -1) || return 2
            pid="${launched##* }"
            case "$pid" in
              ''|*[!0-9]*) echo "launch did not give a pid: $launched"; return 2 ;;
            esac
            echo "launched as $pid"
            sleep 15
            # A picture is worth having, not worth failing for.
            shoot "$label" "$udid" || echo "::warning::No screenshot on $label."
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::The app exited within 15 seconds of launch on $label."
              xcrun simctl spawn "$udid" log show --last 1m --predicate 'process == "Slopcoder"' | tail -100 || true
              return 1
            fi
            return 0
          }

          # Up to three goes, starting the device over between them. `required`
          # says what to do if the simulator never cooperates: fail, or say so
          # and move on.
          smoke() {
            local label="$1" udid="$2" required="$3" try result
            echo "::group::$label ($udid)"
            for try in 1 2 3; do
              result=0
              attempt "$label" "$udid" || result=$?
              xcrun simctl shutdown "$udid" > /dev/null 2>&1 || true
              if [ "$result" -eq 0 ]; then
                echo "::endgroup::"
                return 0
              fi
              if [ "$result" -eq 1 ]; then
                echo "::endgroup::"
                exit 1
              fi
              echo "The simulator gave out on $label (go $try of 3); starting it over."
              sleep 10
            done
            echo "::endgroup::"
            if [ "$required" = required ]; then
              echo "::error::The $label simulator never got as far as running the app."
              exit 1
            fi
            echo "::warning::The $label simulator never got as far as running the app; nothing was learned about the app there."
          }

          smoke iphone "$(pick plain)" required
          duo="$(pick duo)"
          if [ -n "$duo" ]; then
            # The Duo simulator is the less steady of the two on a hosted
            # runner. If it will not run, that is a warning, not a failure:
            # the plain iPhone has already shown whether the app starts.
            smoke duo "$duo" optional
          else
            echo "::warning::No iPhone Duo simulator on this runner; only the plain iPhone was tried."
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshot-*.png
          retention-days: 14

  # The release is the one build made by Xcode rather than xtool (see
  # release.yml). This builds that project unsigned, so a change that breaks it
  # is found when it reaches main and not on the day of a release.
  xcode:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Generate the Xcode project
        run: |
          python3 scripts/xcode-plists.py
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build, unsigned
        run: |
          xcodebuild -project Slopcoder.xcodeproj \
            -scheme SlopcoderApp -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            build
